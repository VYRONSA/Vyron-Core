name: Total Production Deploy Bypass
on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Project Dependencies
        run: npm ci

      - name: Compile Next.js Application
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: "https://ujgnhcwertihoqjgaofn.supabase.co"
          NEXT_PUBLIC_SUPABASE_ANON_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVqZ25oY3dlcnRpaG9xamdhb2ZuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjExMTI1ODMsImV4cCI6MjA3NjY4ODU4M30.4i0t_Wcl14_fsh5WwT7iMRw4m9T2V_XfWp6m6Lh2bZ0"

      - name: Deploy Direct to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod'